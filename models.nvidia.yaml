# ── models.nvidia.yaml ──────────────────────────────────────────────────────
# LiteLLM config for NVIDIA GPU backend (vLLM).
# Mounted as /app/config.yaml when BACKEND=nvidia.
#
# Every client model name below routes to vLLM served id "qwen3.8"
# (weights = VLLM_MODEL in .env).
#
# To switch weights: change VLLM_MODEL in .env → make restart
# ─────────────────────────────────────────────────────────────────────────────

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  stream_timeout: 300
  num_retries: 2
  cache: true
  cache_params:
    type: local
    ttl: 600
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

model_list:

  - model_name: qwen3.8
    litellm_params:
      model: openai/qwen3.8
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3.8
      description: "Qwen3.8 (canonical)"
      supports_function_calling: true

  - model_name: qwen3.8-coder
    litellm_params:
      model: openai/qwen3.8
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3.8-coder
      description: "Alias → qwen3.8"
      supports_function_calling: true

  - model_name: qwen3-coder
    litellm_params:
