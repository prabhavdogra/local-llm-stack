# ── models.nvidia.yaml ──────────────────────────────────────────────────────
# LiteLLM config for NVIDIA GPU backend (vLLM).
# Mounted as /app/config.yaml when BACKEND=nvidia.
#
# ALL aliases below route to the same active GPU weights (VLLM_MODEL in .env).
# Clients can keep calling qwen3.6-coder / qwen3.8 / qwen3-coder — nothing breaks
# when you swap the underlying HF checkpoint.
#
# To switch weights: change VLLM_MODEL in .env → make restart
# ─────────────────────────────────────────────────────────────────────────────

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  stream_timeout: 300
  num_retries: 2
  cache: true
  cache_params:
    type: local
    ttl: 600
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

model_list:

  # ── Primary / current ───────────────────────────────────────────────────
  - model_name: qwen3.8
    litellm_params:
      model: openai/qwen3-coder
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3.8
      description: "Qwen3.8 (current GPU weights)"
      supports_function_calling: true

  - model_name: qwen3.8-coder
    litellm_params:
      model: openai/qwen3-coder
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3.8-coder
      description: "Qwen3.8 coder alias → same GPU weights"
      supports_function_calling: true

  - model_name: qwen3-coder
    litellm_params:
      model: openai/qwen3-coder
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3-coder
      description: "Stable coder alias → Qwen3.8"
      supports_function_calling: true

  # ── Legacy (do not remove — existing harnesses / Cursor / services) ─────
  - model_name: qwen3.6-coder
    litellm_params:
      model: openai/qwen3-coder
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3.6-coder
      description: "Compat: qwen3.6-coder → Qwen3.8"
      supports_function_calling: true

  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3-coder
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: qwen3.6
      description: "Compat: qwen3.6 → Qwen3.8"
      supports_function_calling: true

  - model_name: default
    litellm_params:
      model: openai/qwen3-coder
      api_key: none
      api_base: http://vllm:8000/v1
      supports_function_calling: true
    model_info:
      id: default
      description: "Default alias → active GPU model"
      supports_function_calling: true
