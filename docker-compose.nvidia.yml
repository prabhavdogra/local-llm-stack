# ── NVIDIA GPU Override ──────────────────────────────────────────────────────
# Adds vLLM inference server and rewires LiteLLM to use it.
# Merged automatically when BACKEND=nvidia (`make up` reads .env).
#
# Model selection is fully env-driven:
#   1. Set VLLM_MODEL in .env
#   2. Run: make restart
#
# DGX Spark (GB10 / sm_121): use a Spark-built image. Stock vllm/vllm-openai
# only ships sm_120 kernels and is ~2–3× slower on this hardware.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── vLLM Inference Server (GPU) ─────────────────────────────────────────
  vllm:
    # Built for DGX Spark (ARM64 + sm_121). Updated frequently (eugr nightlies).
    image: ${VLLM_IMAGE:-eugr/spark-vllm:latest}
    # NGC entrypoint is a generic shell; call vllm directly.
    entrypoint: ["vllm"]
    container_name: vllm
    ipc: host
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_LOGGING_LEVEL=INFO
      # SM121 / Spark correctness + backends
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_USE_FLASHINFER_MOE_FP4=0
    command:
      - serve
      - ${VLLM_MODEL:-Inferact/Qwen3.8-27B-NVFP4}
      # Canonical served id. LiteLLM aliases (qwen3-coder, qwen3.6-coder, …)
      # all rewrite to this name before hitting vLLM.
      - --served-model-name
      - qwen3.8
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --dtype
      - auto
      - --kv-cache-dtype
      - fp8
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.87}"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-32768}"
      - --tensor-parallel-size
      - "${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      - --trust-remote-code
      - --enable-prefix-caching
      - --attention-backend
      - TRITON_ATTN
      # No --enforce-eager: CUDA graphs are critical on GB10
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llmstack
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 1800s

  # ── LiteLLM overrides ──────────────────────────────────────────────────
  litellm:
    volumes:
      - ./models.nvidia.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      # Points at the stable vLLM served name (not the HF repo id)
      - LITELLM_MODEL=openai/qwen3.8
    depends_on:
      vllm:
        condition: service_healthy

  # ── ngrok Tunnel (optional — public HTTPS for Cursor) ───────────────────
  # Start with:  COMPOSE_PROFILES=ngrok make up
  # Requires NGROK_AUTHTOKEN and NGROK_DOMAIN in .env
  # Shared pool (del.llm): --pooling-enabled load-balances across agents.
  # Personal / pinned traffic: use http://gpu.local:4000 (LAN) instead of ngrok.
  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http litellm:4000 --url https://${NGROK_DOMAIN} --pooling-enabled
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      - llmstack
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  huggingface_cache:
